<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Baixando sua aula · IA com Ton</title>
<!-- Página aberta pelo link do e-mail. Sem Pixel nem rastreio: o endereço tem o link pessoal da pessoa. -->
<style>
  :root{--navy:#0A1430;--azul:#1E6BFF;--ciano:#5CC8FF;--texto:#16203A;--suave:#5B6478;--fundo:#F6F8FC;--card:#fff;--linha:#DCE3F0}
  @media (prefers-color-scheme:dark){:root{--texto:#E8EEFC;--suave:#A9B6D3;--fundo:#070D1F;--card:#0F1A38;--linha:#22305A}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--fundo);color:var(--texto);font:17px/1.55 "Segoe UI",Roboto,Arial,sans-serif;padding:16px}
  .caixa{max-width:460px;width:100%;background:var(--card);border:1px solid var(--linha);border-radius:20px;padding:32px 28px;text-align:center}
  .marca{font-weight:900;letter-spacing:.5px;margin:0 0 18px}
  .marca b{color:var(--ciano)}
  h1{font-size:22px;margin:0 0 10px}
  p{color:var(--suave);margin:0 0 18px}
  a.botao{display:inline-block;background:var(--azul);color:#fff;text-decoration:none;font-weight:800;padding:14px 22px;border-radius:12px}
  .dica{font-size:14px;margin-top:18px}
  a{color:var(--azul)}
</style>
</head>
<body>
<main class="caixa">
  <p class="marca">IA com <b>Ton</b></p>
  <h1 id="titulo">Abrindo a sua aula…</h1>
  <p id="texto">Se o PDF não abrir sozinho em alguns segundos, toque no botão.</p>
  <a id="botao" class="botao" href="https://iacomton.com.br/">Baixar a aula em PDF</a>
  <p class="dica">Está no app do Gmail ou do Instagram? Se não abrir, use <b>Abrir no navegador</b>. Salve o PDF para ter sempre à mão.</p>
  <p class="dica"><a href="https://iacomton.com.br/">Ver mais aulas no site</a></p>
</main>
<script>
(function () {
  var t = new URLSearchParams(location.search).get("t") || "";
  var botao = document.getElementById("botao");
  if (!/^[A-Za-z0-9_-]{10,400}\.[0-9a-f]{64}$/.test(t)) {
    document.getElementById("titulo").textContent = "Link incompleto";
    document.getElementById("texto").textContent = "Abra de novo pelo botão do e-mail. Se continuar, volte à página da aula e peça de novo.";
    botao.textContent = "Ir para o site";
    return;
  }
  var destino = "https://xhqzakikatookphvjewy.supabase.co/functions/v1/iacomton-lead?t=" + encodeURIComponent(t);
  botao.href = destino;
  setTimeout(function () { location.replace(destino); }, 600);
})();
</script>
</body>
</html>
